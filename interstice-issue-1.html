<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Interstice Journal - Issue I</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <link rel="preload" as="image" href="interstice-issue-1-pages/1.jpg" fetchpriority="high">

    <style>
        :root {
            --text-inverse: #f5f3ef;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;
            --book-max-height: 1100px;
            --hover-scale: 1.20;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; width: 100%; }

        body {
            font-family: var(--font-body);
            color: var(--text-inverse);
            background-color: #1a1d21;
            background-image: url('images/issue-1-background.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            position: relative;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 12, 15, 0.65); 
            z-index: 0;
            pointer-events: none;
        }

        .reader-header, .viewer-container, .reader-footer, .top-bar {
            position: relative;
            z-index: 2;
        }

        /* TOP BAR */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1.5rem;
            flex-shrink: 0;
            gap: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .top-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            font-family: var(--font-body);
            font-size: 0.82rem;
            font-weight: 500;
            color: #fff;
            text-decoration: none;
            padding: 0.5rem 1.1rem;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            white-space: nowrap;
            cursor: pointer;
        }
        
        .top-pill:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.4);
            color: #fff;
            opacity: 1;
        }

        .top-pill svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.3s ease;
        }

        .back-to-site:hover svg { transform: translateX(-3px); }
        .download-btn:hover svg { transform: translateY(3px); }

        .download-btn {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.3);
        }
        .download-btn:hover {
            background: #fff;
            color: #1a1a1a;
            border-color: #fff;
        }

        /* Header */
        .reader-header {
            text-align: center;
            padding: 0.5rem 1rem 0.5rem;
            flex-shrink: 0;
        }
        .reader-header h1 {
            font-family: var(--font-heading);
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            font-style: italic;
            margin-bottom: 0.1rem;
            color: var(--text-inverse);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .reader-header .subtitle {
            font-size: 0.7rem;
            color: rgba(245, 243, 239, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        /* Viewer */
        .viewer-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4rem;
            min-height: 0; 
        }

        /* Book */
        .book {
            display: flex;
            height: 100%;
            max-height: var(--book-max-height);
            width: auto; 
            position: relative;
            background: #fff;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.1);
            border-radius: 6px;
            transition: width 0.4s ease;
            overflow: visible;
        }

        /* Only apply spine shadow when in spread mode */
        .book.spread::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 60px;
            transform: translateX(-50%);
            background: linear-gradient(to right, rgba(0,0,0,0.03) 0%, rgba(0,0,0,0.18) 50%, rgba(0,0,0,0.03) 100%);
            pointer-events: none;
            z-index: 5;
        }

        /* Book loading spinner */
        .book-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            pointer-events: none;
        }
        .book-loader.visible { display: flex; }
        .book-loader {
            background: rgba(255, 255, 255, 0.92);
            padding: 1.4rem 1.8rem;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }
        .book-loader .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(30, 30, 30, 0.15);
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        .book-loader span {
            font-family: var(--font-heading);
            font-style: italic;
            font-size: 0.95rem;
            color: #666;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Pages */
        .page {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
            background: #fff;
            position: relative;
            border-radius: 6px;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.5s ease;
            cursor: pointer;
            z-index: 1;
        }

        .book.spread .page.left-page {
            transform-origin: left center;
            box-shadow: inset -10px 0 20px -10px rgba(0,0,0,0.06);
        }
        .book.spread .page.right-page {
            transform-origin: right center;
            box-shadow: inset 10px 0 20px -10px rgba(0,0,0,0.06);
        }
        .book.single .page { transform-origin: center center; }

        .page:hover {
            transform: scale(var(--hover-scale));
            box-shadow: 0 40px 90px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,0,0,0.05);
            z-index: 30;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: fill; 
            transition: opacity 0.3s ease;
            display: block;
            border-radius: 6px;
            background-color: #fff;
        }

        /* How many pages shown at a time — controlled by JS via the .mode class */
        .book.mode-spread .page { width: 50%; }
        .book.mode-single .page { width: 100%; }

        .fading img { opacity: 0; }

        /* Hide the image until it actually has a source (avoids alt text / blank flash) */
        .page img:not([src]) { visibility: hidden; }

        /* Page-shaped skeleton shimmer while the first image is on its way */
        .book.is-loading .page {
            background: linear-gradient(100deg, #ececec 30%, #f8f8f8 50%, #ececec 70%);
            background-size: 200% 100%;
            animation: shimmer 1.4s ease-in-out infinite;
        }
        @keyframes shimmer {
            from { background-position: 200% 0; }
            to   { background-position: -200% 0; }
        }

        /* Nav buttons */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.5rem;
            font-family: var(--font-heading);
            color: var(--text-inverse);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            z-index: 40;
        }
        .nav-btn:hover {
            background: rgba(255,255,255,0.25);
            border-color: rgba(255,255,255,0.4);
            transform: translateY(-50%) scale(1.05);
        }
        .nav-btn:disabled {
            opacity: 0.15;
            cursor: not-allowed;
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.5);
            transform: translateY(-50%);
        }
        .nav-prev { left: 0.5rem; }
        .nav-next { right: 0.5rem; }

        /* Footer */
        .reader-footer {
            text-align: center;
            padding: 0.8rem 1rem 1rem;
            flex-shrink: 0;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 2rem;
        }

        .page-indicator {
            font-family: var(--font-heading);
            font-size: 0.9rem;
            font-style: italic;
            color: rgba(245, 243, 239, 0.7);
        }

        .back-link {
            display: inline-block;
            font-family: var(--font-heading);
            font-style: italic;
            color: var(--text-inverse);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 0.35rem 1rem;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 50px;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(5px);
        }
        .back-link:hover {
            background-color: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.8);
        }

        /* Responsive — just spacing adjustments */
        @media (max-width: 1100px) {
            :root { --book-max-height: 100%; }
            .top-bar { padding: 0.7rem 1rem; }
            .top-pill { font-size: 0.75rem; padding: 0.45rem 0.9rem; }
            .top-bar-left { gap: 0.5rem; }
            .reader-header { padding: 0.4rem 0.5rem 0.2rem; }
            .viewer-container { padding: 0.5rem 2.2rem; }
            .nav-btn { width: 36px; height: 36px; font-size: 1.1rem; }
            .nav-prev { left: 0.2rem; }
            .nav-next { right: 0.2rem; }
            .book { border-radius: 4px; }
            .book.spread::after { display: none; }
            .reader-footer {
                flex-direction: column;
                gap: 0.4rem;
                padding: 0.4rem 1rem 0.6rem;
            }
            .page:hover {
                transform: none;
                box-shadow: none;
                z-index: 1;
            }
        }

        @media (max-width: 700px) {
            .top-bar-right { display: none; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="top-bar-left">
            <a href="index.html" class="top-pill back-to-site">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back to Main Site
            </a>
            <a href="interstice-issue-1.pdf" download class="top-pill download-btn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Download PDF
            </a>
        </div>
        <span class="top-bar-right" style="font-family: var(--font-heading); font-style: italic; color: rgba(245,243,239,0.6); font-size: 0.85rem;">Interstice — Issue I</span>
    </div>

    <header class="reader-header">
        <h1>Interstice</h1>
        <p class="subtitle">Issue I, 2026</p>
    </header>

    <div class="viewer-container">
        <button class="nav-btn nav-prev" id="prevBtn" onclick="changeSpread(-1)" aria-label="Previous Page">‹</button>
        <button class="nav-btn nav-next" id="nextBtn" onclick="changeSpread(1)" aria-label="Next Page">›</button>

        <div class="book mode-single is-loading" id="book">
            <div class="book-loader visible" id="bookLoader">
                <div class="spinner"></div>
                <span id="loaderText">Opening journal…</span>
            </div>
            
            <div class="page left-page" id="leftPage">
                <img id="leftImage" alt="Left Page">
            </div>
            <div class="page right-page" id="rightPage">
                <img id="rightImage" alt="Right Page">
            </div>
        </div>
    </div>

    <footer class="reader-footer">
        <div class="page-indicator" id="pageIndicator">Loading…</div>
        <a href="index.html" class="back-link">← Return to Ananke Projects</a>
    </footer>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        const totalPages = 97; 
        const imageFolder = 'interstice-issue-1-pages/'; 
        const imageExtension = '.jpg'; 
        const pageAspectRatio = 0.7; 

        const book = document.getElementById('book');
        const leftPage = document.getElementById('leftPage');
        const rightPage = document.getElementById('rightPage');
        const leftImage = document.getElementById('leftImage');
        const rightImage = document.getElementById('rightImage');
        const pageIndicator = document.getElementById('pageIndicator');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const bookLoader = document.getElementById('bookLoader');

        // ⭐ Detect mobile — SIMPLE, RELIABLE check ⭐
        // Uses BOTH viewport width AND touch capability.
        // Any phone or tablet gets the single-page mobile experience.
        function detectMobile() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const isTouch = ('ontouchstart' in window) ||
                            (navigator.maxTouchPoints > 0) ||
                            window.matchMedia('(pointer: coarse)').matches;
            const shortSide = Math.min(screen.width, screen.height);
            return w <= 800 ||                       // narrow window
                   (h > w && w <= 1024) ||           // portrait
                   (isTouch && shortSide <= 820);    // any phone, even landscape / "desktop site" mode
        }

        let isMobile = detectMobile();
        let currentView = 0;
        let isFading = false;

        // Number of views (pages on mobile, spreads on desktop)
        function getTotalViews() {
            return isMobile ? totalPages : (Math.floor((totalPages - 1) / 2) + 1);
        }

        // ==========================================
        // 1. APPLY MODE CLASS TO THE BOOK
        // ==========================================
        function applyMode() {
            if (isMobile) {
                book.classList.remove('mode-spread');
                book.classList.add('mode-single');
            } else {
                book.classList.remove('mode-single');
                book.classList.add('mode-spread');
            }
        }

        // ==========================================
        // 2. RESIZE THE BOOK
        // ==========================================
        function resizeBook() {
            const viewer = document.querySelector('.viewer-container');
            const computedStyle = getComputedStyle(document.documentElement);
            const maxHeight = computedStyle.getPropertyValue('--book-max-height').trim();
            
            let availableHeight;
            if (maxHeight === '100%') {
                availableHeight = viewer.clientHeight;
            } else {
                availableHeight = Math.min(viewer.clientHeight, parseInt(maxHeight));
            }

            book.style.height = availableHeight + 'px';

            // Width depends on mode
            const multiplier = isMobile ? 1 : 2;
            book.style.width = (availableHeight * pageAspectRatio * multiplier) + 'px';
        }

        // ==========================================
        // 3. IMAGE PRELOADER
        // ==========================================
        function preloadImage(src) {
            return new Promise((resolve) => {
                if (!src) return resolve();
                const img = new Image();
                img.src = src;
                if (img.decode) {
                    img.decode().then(() => resolve()).catch(() => resolve());
                } else {
                    img.onload = () => resolve();
                    img.onerror = () => resolve();
                }
            });
        }

        // ==========================================
        // 4. WORK OUT WHICH PAGES TO SHOW
        // ==========================================
        function getPagesForView(viewIndex) {
            if (isMobile) {
                // Mobile: one page per view.
                const pageNum = viewIndex + 1;
                if (pageNum > totalPages) return { left: null, right: null, text: '' };
                return { 
                    left: null,
                    right: pageNum,
                    text: viewIndex === 0 ? 'Cover' : `Page ${pageNum} of ${totalPages}`
                };
            } else {
                // Desktop: two pages per spread.
                if (viewIndex === 0) {
                    return { left: null, right: 1, text: 'Cover' };
                }
                const left = viewIndex * 2;
                const right = left + 1;
                if (right > totalPages) {
                    return { left: left, right: null, text: `Page ${left} of ${totalPages}` };
                }
                return { left, right, text: `Pages ${left}-${right} of ${totalPages}` };
            }
        }

        function applyLayout(left, right) {
            if (left && right) {
                book.classList.remove('single');
                book.classList.add('spread');
                leftPage.style.display = 'flex';
                rightPage.style.display = 'flex';
            } else if (right) {
                book.classList.remove('spread');
                book.classList.add('single');
                leftPage.style.display = 'none';
                rightPage.style.display = 'flex';
            } else if (left) {
                book.classList.remove('spread');
                book.classList.add('single');
                leftPage.style.display = 'flex';
                rightPage.style.display = 'none';
            }
        }

        // ==========================================
        // 5. DISPLAY A VIEW
        // ==========================================
        async function displaySpread(viewIndex) {
            if (isFading) return; 
            isFading = true;

            const { left, right, text } = getPagesForView(viewIndex);
            const leftSrc = left ? `${imageFolder}${left}${imageExtension}` : null;
            const rightSrc = right ? `${imageFolder}${right}${imageExtension}` : null;

            // Show loader
            document.getElementById('loaderText').textContent =
                book.classList.contains('is-loading') ? 'Opening journal…' : 'Loading page…';
            bookLoader.classList.add('visible');

            // Preload both images
            await Promise.all([preloadImage(leftSrc), preloadImage(rightSrc)]);

            // Hide loader
            bookLoader.classList.remove('visible');

            // Fade out
            leftPage.classList.add('fading');
            rightPage.classList.add('fading');

            setTimeout(() => {
                applyLayout(left, right);

                // Set images
                if (leftSrc) leftImage.src = leftSrc; else leftImage.removeAttribute('src');
                if (rightSrc) rightImage.src = rightSrc; else rightImage.removeAttribute('src');
                book.classList.remove('is-loading');

                // Indicator
                pageIndicator.innerText = text;

                // Buttons
                prevBtn.disabled = viewIndex === 0;
                nextBtn.disabled = viewIndex === getTotalViews() - 1;

                // Resize
                resizeBook();

                // Fade in
                leftPage.classList.remove('fading');
                rightPage.classList.remove('fading');

                setTimeout(() => { isFading = false; }, 300);

                // Quietly warm up the next view
                const next = getPagesForView(viewIndex + 1);
                if (next.left) preloadImage(`${imageFolder}${next.left}${imageExtension}`);
                if (next.right) preloadImage(`${imageFolder}${next.right}${imageExtension}`);
            }, 200);
        }

        // ==========================================
        // 6. NAVIGATION
        // ==========================================
        function changeSpread(direction) {
            const newView = currentView + direction;
            if (newView >= 0 && newView < getTotalViews()) {
                currentView = newView;
                displaySpread(currentView);
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight') { e.preventDefault(); changeSpread(1); }
            if (e.key === 'ArrowLeft') { e.preventDefault(); changeSpread(-1); }
        });

        // ==========================================
        // 7. HANDLE RESIZE (with mode switching)
        // ==========================================
        window.addEventListener('resize', () => {
            const wasMobile = isMobile;
            isMobile = detectMobile();
            
            if (wasMobile !== isMobile) {
                // Mode changed — restart from cover
                applyMode();
                currentView = 0;
                isFading = false;
                displaySpread(0);
            } else {
                resizeBook();
            }
        });

        // ==========================================
        // 8. INITIALIZE
        // ==========================================
        function init() {
            applyMode();
            // Show a page-shaped skeleton + spinner right away, before any image arrives
            const first = getPagesForView(0);
            applyLayout(first.left, first.right);
            resizeBook();
            bookLoader.classList.add('visible');
            pageIndicator.innerText = 'Loading…';
            displaySpread(0);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

    </script>

</body>
</html>
