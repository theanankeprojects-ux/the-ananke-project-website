<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interstice Journal - Issue I</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #e8e6e1;
            --text-inverse: #f5f3ef;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;
            
            /* Book Size */
            --book-max-height: 1100px;
            
            /* Hover scale */
            --hover-scale: 1.20;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; width: 100%; }

        body {
            font-family: var(--font-body);
            color: var(--text-inverse);
            
            /* ⭐ FIXED: uses images/ folder path ⭐ */
            background-image: url('images/issue-1-background.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            
            position: relative;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 12, 15, 0.65); 
            z-index: 0;
            pointer-events: none;
        }

        .reader-header, .viewer-container, .reader-footer {
            position: relative;
            z-index: 2;
        }

        /* ============================================
           ⭐ TOP BAR — "Back to Main Site" ⭐
           ============================================ */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1.5rem;
            flex-shrink: 0;
            z-index: 10;
            gap: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .back-to-site {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            font-family: var(--font-body);
            font-size: 0.82rem;
            font-weight: 500;
            color: #fff;
            text-decoration: none;
            padding: 0.5rem 1.1rem;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        
        .back-to-site:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.4);
            color: #fff;
            opacity: 1;
        }
        
        .back-to-site svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.3s ease;
        }
        
        .back-to-site:hover svg {
            transform: translateX(-3px);
        }

        /* Header */
        .reader-header {
            text-align: center;
            padding: 0.5rem 1rem 0.5rem;
            flex-shrink: 0;
        }
        .reader-header h1 {
            font-family: var(--font-heading);
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            font-style: italic;
            margin-bottom: 0.1rem;
            letter-spacing: -0.02em;
            color: var(--text-inverse);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .reader-header .subtitle {
            font-size: 0.7rem;
            color: rgba(245, 243, 239, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        /* The Viewer */
        .viewer-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4rem;
            min-height: 0; 
        }

        /* The Book */
        .book {
            display: flex;
            height: 100%;
            max-height: var(--book-max-height);
            width: auto; 
            position: relative;
            background: white;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.1);
            border-radius: 6px;
            transition: width 0.4s ease;
            overflow: visible;
        }

        /* Center spine shadow */
        .book.spread::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 60px;
            transform: translateX(-50%);
            background: linear-gradient(to right, rgba(0,0,0,0.03) 0%, rgba(0,0,0,0.18) 50%, rgba(0,0,0,0.03) 100%);
            pointer-events: none;
            z-index: 5;
        }

        /* Individual pages */
        .page {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
            background: white;
            position: relative;
            border-radius: 6px;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.5s ease;
            cursor: pointer;
            z-index: 1;
        }

        .book.spread .page.left-page {
            transform-origin: left center;
            box-shadow: inset -10px 0 20px -10px rgba(0,0,0,0.06);
        }
        .book.spread .page.right-page {
            transform-origin: right center;
            box-shadow: inset 10px 0 20px -10px rgba(0,0,0,0.06);
        }
        .book.single .page {
            transform-origin: center center;
        }

        /* Hover lift */
        .page:hover {
            transform: scale(var(--hover-scale));
            box-shadow: 0 40px 90px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,0,0,0.05);
            z-index: 30;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: fill; 
            transition: opacity 0.3s ease;
            display: block;
            border-radius: 6px;
        }

        .book.spread .page { width: 50%; }
        .book.single .page { width: 100%; }

        .fading img { opacity: 0; }

        /* Navigation Buttons */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.5rem;
            font-family: var(--font-heading);
            color: var(--text-inverse);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            z-index: 40;
        }
        .nav-btn:hover {
            background: rgba(255,255,255,0.25);
            border-color: rgba(255,255,255,0.4);
            transform: translateY(-50%) scale(1.05);
        }
        .nav-btn:disabled {
            opacity: 0.15;
            cursor: not-allowed;
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.5);
            transform: translateY(-50%);
        }
        .nav-prev { left: 0.5rem; }
        .nav-next { right: 0.5rem; }

        /* Footer */
        .reader-footer {
            text-align: center;
            padding: 0.8rem 1rem 1rem;
            flex-shrink: 0;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            z-index: 2;
        }

        .page-indicator {
            font-family: var(--font-heading);
            font-size: 0.9rem;
            font-style: italic;
            color: rgba(245, 243, 239, 0.7);
            letter-spacing: 0.05em;
        }

        .back-link {
            display: inline-block;
            font-family: var(--font-heading);
            font-style: italic;
            color: var(--text-inverse);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 0.35rem 1rem;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 50px;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(5px);
        }
        .back-link:hover {
            background-color: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.8);
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--font-heading);
            font-style: italic;
            font-size: 1.5rem;
            color: rgba(245, 243, 239, 0.7);
            z-index: 5;
        }

        /* Responsive */
        @media (max-width: 1100px) {
            :root {
                --book-max-height: 100%; 
            }
            .top-bar { padding: 0.7rem 1rem; }
            .back-to-site { font-size: 0.75rem; padding: 0.45rem 0.9rem; }
            .reader-header { padding: 0.4rem 0.5rem 0.2rem; }
            .viewer-container { padding: 0.5rem 2.2rem; }
            .nav-btn {
                width: 36px;
                height: 36px;
                font-size: 1.1rem;
            }
            .nav-prev { left: 0.2rem; }
            .nav-next { right: 0.2rem; }
            .book { border-radius: 4px; }
            .book.spread::after { display: none; }
            
            .reader-footer {
                flex-direction: column;
                gap: 0.4rem;
                padding: 0.4rem 1rem 0.6rem;
            }
            
            .page:hover {
                transform: none;
                box-shadow: none;
                z-index: 1;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================
         ⭐ TOP BAR — Back to Main Site ⭐
         ============================================ -->
    <div class="top-bar">
        <a href="index.html" class="back-to-site">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Main Site
        </a>
        <span style="font-family: var(--font-heading); font-style: italic; color: rgba(245,243,239,0.6); font-size: 0.85rem;">Interstice — Issue I</span>
    </div>

    <header class="reader-header">
        <h1>Interstice</h1>
        <p class="subtitle">Issue I, 2026</p>
    </header>

    <div class="viewer-container">
        <div class="loading" id="loadingMsg">Loading Journal...</div>
        
        <button class="nav-btn nav-prev" id="prevBtn" onclick="changeSpread(-1)" aria-label="Previous Spread">‹</button>
        <button class="nav-btn nav-next" id="nextBtn" onclick="changeSpread(1)" aria-label="Next Spread">›</button>

        <div class="book" id="book">
            <div class="page left-page" id="leftPage">
                <img id="leftImage" src="" alt="Left Page">
            </div>
            <div class="page right-page" id="rightPage">
                <img id="rightImage" src="" alt="Right Page">
            </div>
        </div>
    </div>

    <footer class="reader-footer">
        <div class="page-indicator" id="pageIndicator">Cover</div>
        <a href="index.html" class="back-link">← Return to Ananke Projects</a>
    </footer>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        const totalPages = 97; 
        const imageFolder = 'interstice-issue-1-pages/'; 
        const imageExtension = '.jpg'; 
        const pageAspectRatio = 0.7; 

        const book = document.getElementById('book');
        const leftPage = document.getElementById('leftPage');
        const rightPage = document.getElementById('rightPage');
        const leftImage = document.getElementById('leftImage');
        const rightImage = document.getElementById('rightImage');
        const pageIndicator = document.getElementById('pageIndicator');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const loadingMsg = document.getElementById('loadingMsg');

        let currentSpread = 0; 
        let isFading = false;

        const totalSpreads = Math.floor((totalPages - 1) / 2) + 1;

        // ==========================================
        // 1. RESIZE THE BOOK BASED ON AVAILABLE SPACE
        // ==========================================
        function resizeBook() {
            const viewer = document.querySelector('.viewer-container');
            const computedStyle = getComputedStyle(document.documentElement);
            const maxHeight = computedStyle.getPropertyValue('--book-max-height').trim();
            
            let availableHeight;
            if (maxHeight === '100%') {
                availableHeight = viewer.clientHeight;
            } else {
                availableHeight = Math.min(viewer.clientHeight, parseInt(maxHeight));
            }

            book.style.height = availableHeight + 'px';

            if (book.classList.contains('spread')) {
                book.style.width = (availableHeight * pageAspectRatio * 2) + 'px';
            } else {
                book.style.width = (availableHeight * pageAspectRatio) + 'px';
            }
        }

        window.addEventListener('resize', resizeBook);

        // ==========================================
        // 2. LOAD AND DISPLAY THE SPREAD
        // ==========================================
        function displaySpread(spreadIndex) {
            if (isFading) return; 
            isFading = true;

            leftPage.classList.add('fading');
            rightPage.classList.add('fading');

            setTimeout(() => {
                let leftPageNum = null;
                let rightPageNum = null;
                let indicatorText = '';

                if (spreadIndex === 0) {
                    leftPageNum = null;
                    rightPageNum = 1;
                    indicatorText = 'Cover';
                    book.classList.remove('spread');
                    book.classList.add('single');
                    leftPage.style.display = 'none'; 
                    rightPage.style.display = 'flex';
                } else {
                    leftPageNum = spreadIndex * 2;
                    rightPageNum = leftPageNum + 1;
                    
                    if (rightPageNum > totalPages) {
                        rightPageNum = null;
                        indicatorText = `Page ${leftPageNum} of ${totalPages}`;
                        book.classList.remove('spread');
                        book.classList.add('single');
                        leftPage.style.display = 'flex';
                        rightPage.style.display = 'none';
                    } else {
                        book.classList.remove('single');
                        book.classList.add('spread');
                        leftPage.style.display = 'flex';
                        rightPage.style.display = 'flex';
                        indicatorText = `Pages ${leftPageNum}-${rightPageNum} of ${totalPages}`;
                    }
                }

                leftImage.src = leftPageNum ? `${imageFolder}${leftPageNum}${imageExtension}` : '';
                rightImage.src = rightPageNum ? `${imageFolder}${rightPageNum}${imageExtension}` : '';

                pageIndicator.innerText = indicatorText;
                loadingMsg.style.display = 'none'; 

                prevBtn.disabled = spreadIndex === 0;
                nextBtn.disabled = spreadIndex === totalSpreads - 1;

                resizeBook();

                leftPage.classList.remove('fading');
                rightPage.classList.remove('fading');
                
                setTimeout(() => {
                    isFading = false;
                }, 300);
            }, 300); 
        }

        // ==========================================
        // 3. NAVIGATION LOGIC
        // ==========================================
        function changeSpread(direction) {
            const newSpread = currentSpread + direction;
            if (newSpread >= 0 && newSpread < totalSpreads) {
                currentSpread = newSpread;
                displaySpread(currentSpread);
            }
        }

        // ==========================================
        // 4. KEYBOARD NAVIGATION
        // ==========================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight') { e.preventDefault(); changeSpread(1); }
            if (e.key === 'ArrowLeft') { e.preventDefault(); changeSpread(-1); }
        });

        // ==========================================
        // INITIALIZE
        // ==========================================
        window.onload = () => {
            displaySpread(0);
            setTimeout(() => {
                const preloads = [2, 3, 4, 5];
                preloads.forEach(pageNum => {
                    if (pageNum <= totalPages) {
                        const img = new Image();
                        img.src = `${imageFolder}${pageNum}${imageExtension}`;
                    }
                });
            }, 1000);
        };

    </script>

</body>
</html>
