<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Interstice Journal - Issue I</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --text-inverse: #f5f3ef;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; width: 100%; }

        body {
            font-family: var(--font-body);
            color: var(--text-inverse);
            background-color: #1a1d21;
            background-image: url('images/issue-1-background.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            position: relative;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 12, 15, 0.75); 
            z-index: 0;
            pointer-events: none;
        }

        .top-bar, .reader-header, .pdf-viewer-container, .reader-footer {
            position: relative;
            z-index: 2;
        }

        /* ⭐ TOP BAR ⭐ */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1.5rem;
            flex-shrink: 0;
            gap: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .top-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            font-family: var(--font-body);
            font-size: 0.82rem;
            font-weight: 500;
            color: #fff;
            text-decoration: none;
            padding: 0.5rem 1.1rem;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            white-space: nowrap;
            cursor: pointer;
        }
        
        .top-pill:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.4);
            color: #fff;
            opacity: 1;
        }

        .top-pill svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.3s ease;
        }

        .back-to-site:hover svg { transform: translateX(-3px); }
        .download-btn:hover svg { transform: translateY(3px); }

        .download-btn {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.3);
        }
        .download-btn:hover {
            background: #fff;
            color: #1a1a1a;
            border-color: #fff;
        }

        /* Header */
        .reader-header {
            text-align: center;
            padding: 0.5rem 1rem 0.5rem;
            flex-shrink: 0;
        }
        .reader-header h1 {
            font-family: var(--font-heading);
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            font-style: italic;
            margin-bottom: 0.1rem;
            color: var(--text-inverse);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .reader-header .subtitle {
            font-size: 0.7rem;
            color: rgba(245, 243, 239, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        /* ⭐ PDF VIEWER ⭐ */
        .pdf-viewer-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 3rem;
            min-height: 0;
        }

        .pdf-frame {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.1);
            overflow: hidden;
        }

        .pdf-frame embed,
        .pdf-frame iframe,
        .pdf-frame object {
            width: 100%;
            height: 100%;
            display: block;
            border: none;
            background: #fff;
        }

        /* Mobile fallback message */
        .pdf-mobile-fallback {
            display: none;
            text-align: center;
            color: #fff;
            padding: 3rem 1.5rem;
            max-width: 500px;
        }
        .pdf-mobile-fallback h3 {
            font-family: var(--font-heading);
            font-style: italic;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #fff;
        }
        .pdf-mobile-fallback p {
            font-size: 0.95rem;
            color: rgba(245, 243, 239, 0.8);
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .pdf-mobile-fallback .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.85rem 1.75rem;
            background: #fff;
            color: #1a1a1a;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .pdf-mobile-fallback .btn-download:hover {
            background: #e8e6e1;
            opacity: 1;
        }

        /* Footer */
        .reader-footer {
            text-align: center;
            padding: 0.8rem 1rem 1rem;
            flex-shrink: 0;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 2rem;
        }

        .page-indicator {
            font-family: var(--font-heading);
            font-size: 0.9rem;
            font-style: italic;
            color: rgba(245, 243, 239, 0.7);
        }

        .back-link {
            display: inline-block;
            font-family: var(--font-heading);
            font-style: italic;
            color: var(--text-inverse);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 0.35rem 1rem;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 50px;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(5px);
        }
        .back-link:hover {
            background-color: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.8);
        }

        /* Responsive */
        @media (max-width: 1100px) {
            .top-bar { padding: 0.7rem 1rem; }
            .top-pill { font-size: 0.75rem; padding: 0.45rem 0.9rem; }
            .top-bar-left { gap: 0.5rem; }
            .reader-header { padding: 0.4rem 0.5rem 0.2rem; }
            .pdf-viewer-container { padding: 0.5rem 1rem; }
            .reader-footer {
                flex-direction: column;
                gap: 0.4rem;
                padding: 0.4rem 1rem 0.6rem;
            }
        }

        @media (max-width: 700px) {
            .top-bar-right { display: none; }
            .pdf-viewer-container { padding: 0.4rem 0.5rem; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="top-bar-left">
            <a href="index.html" class="top-pill back-to-site">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back to Main Site
            </a>
            <a href="interstice-issue-1.pdf" download class="top-pill download-btn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Download PDF
            </a>
        </div>
        <span class="top-bar-right" style="font-family: var(--font-heading); font-style: italic; color: rgba(245,243,239,0.6); font-size: 0.85rem;">Interstice — Issue I</span>
    </div>

    <header class="reader-header">
        <h1>Interstice</h1>
        <p class="subtitle">Issue I, 2026</p>
    </header>

    <div class="pdf-viewer-container">
        <!-- ⭐ THE PDF VIEWER ⭐ -->
        <!-- Uses the browser's built-in PDF viewer for scrolling, zooming, and paging -->
        <div class="pdf-frame">
            <object data="interstice-issue-1.pdf#view=FitH" type="application/pdf" width="100%" height="100%">
                <!-- Fallback for browsers that don't support PDF embedding -->
                <iframe src="interstice-issue-1.pdf#view=FitH" width="100%" height="100%" style="border: none;">
                    <div class="pdf-mobile-fallback">
                        <h3>Your browser can't display this PDF directly</h3>
                        <p>Please download the journal to read it.</p>
                        <a href="interstice-issue-1.pdf" download class="btn-download">
                            Download the Journal (PDF)
                        </a>
                    </div>
                </iframe>
            </object>
        </div>
    </div>

    <footer class="reader-footer">
        <div class="page-indicator">Use your browser's built-in PDF controls to scroll, zoom, and page through the journal</div>
        <a href="index.html" class="back-link">← Return to Ananke Projects</a>
    </footer>

</body>
</html>
